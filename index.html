
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dibba Token Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0b1220;color:#f4f7fb;font-family:Arial,sans-serif}
main{max-width:620px;margin:auto}
.card{background:#131e31;border:1px solid #2b3a52;border-radius:16px;padding:18px;margin:16px 0}
label{display:block;margin:14px 0 7px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #2b3a52;background:#0b1424;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:#57d6a0;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
.status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.hint{color:#aab7ca;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>منشئ عملات سولانا</h1>
<p class="hint">إنشاء رمز SPL على شبكة Solana Mainnet باستخدام Phantom.</p>

<div class="card">
<h2>1. ربط المحفظة</h2>
<button id="connect">ربط Phantom</button>
<p id="wallet" class="status">المحفظة غير متصلة.</p>
</div>

<div class="card">
<h2>2. بيانات العملة</h2>
<label for="tokenName">اسم العملة</label>
<input id="tokenName" maxlength="32" placeholder="Dibba Token">

<label for="tokenSymbol">رمز العملة</label>
<input id="tokenSymbol" maxlength="10" placeholder="DIB">

<label for="decimals">المنازل العشرية</label>
<input id="decimals" type="number" min="0" max="9" value="9">

<label for="supply">الكمية الأولية</label>
<input id="supply" type="number" min="0.000000001" step="any" value="1000000">

<p class="hint">رسوم الشبكة تعتمد على المعاملات والحسابات المطلوبة. راجع كل طلب توقيع داخل Phantom قبل الموافقة.</p>
<button id="create" disabled>إنشاء العملة وسكّ الكمية</button>
</div>

<div class="card">
<h2>الحالة</h2>
<p id="status" class="status">بانتظار ربط المحفظة.</p>
</div>
</main>

<script type="module">
import {Connection, PublicKey, LAMPORTS_PER_SOL} from "https://esm.sh/@solana/web3.js@1.98.4";
import {createMint, getOrCreateAssociatedTokenAccount, mintTo} from "https://esm.sh/@solana/spl-token@0.4.13?external=web3";

const RPC_URL = "https://mainnet.helius-rpc.com/?api-key=PASTE_NEW_HELIUS_KEY_HERE";
const connection = new Connection(RPC_URL, "confirmed");
const $ = id => document.getElementById(id);
let provider = null;
let publicKey = null;
let busy = false;

function status(message) {
  $("status").textContent = message;
}

function findWallet() {
  return window.phantom?.solana?.isPhantom
    ? window.phantom.solana
    : window.solana?.isPhantom
      ? window.solana
      : null;
}

$("connect").onclick = async () => {
  try {
    provider = findWallet();
    if (!provider) {
      throw new Error("افتح الموقع من متصفح Phantom على الآيفون.");
    }
    const result = await provider.connect();
    publicKey = result.publicKey || provider.publicKey;
    if (!publicKey) throw new Error("لم يظهر عنوان المحفظة.");
    $("wallet").textContent = "متصل: " + publicKey.toBase58();
    $("create").disabled = false;
    status("تم الاتصال. تأكد من وجود SOL كافٍ لدفع الرسوم.");
  } catch (e) {
    status("تعذر الاتصال: " + e.message);
  }
};

$("create").onclick = async () => {
  if (busy) return;
  if (!provider || !publicKey) {
    status("اربط المحفظة أولاً.");
    return;
  }

  const decimals = Number($("decimals").value);
  const supplyText = $("supply").value.trim();
  const supply = Number(supplyText);

  if (!Number.isInteger(decimals) || decimals < 0 || decimals > 9) {
    status("المنازل العشرية يجب أن تكون بين 0 و9.");
    return;
  }
  if (!Number.isFinite(supply) || supply <= 0) {
    status("أدخل كمية صحيحة أكبر من صفر.");
    return;
  }

  const raw = supply * (10 ** decimals);
  if (!Number.isSafeInteger(raw) || raw <= 0) {
    status("الكمية كبيرة جداً أو غير دقيقة. قلّل الكمية أو المنازل العشرية.");
    return;
  }

  busy = true;
  $("create").disabled = true;
  $("connect").disabled = true;

  try {
    if (RPC_URL.includes("PASTE_NEW_HELIUS_KEY_HERE")) {
      throw new Error(https://mainnet.helius-rpc.com/?api-key=92edc637-3b1c-470c-9590-5de81934e73b);
    }

    status("جارٍ فحص الشبكة والرصيد...");
    await connection.getVersion();
    const balance = await connection.getBalance(publicKey, "confirmed");

    if (balance < 0.01 * LAMPORTS_PER_SOL) {
      throw new Error("الرصيد أقل من 0.01 SOL. قد تحتاج إلى رصيد أكبر لتغطية الإنشاء والحسابات.");
    }

    status("سيطلب Phantom توقيع إنشاء الرمز. راجع الرسوم ووافق فقط إذا كانت التفاصيل صحيحة.");
    const mint = await createMint(connection, provider, publicKey, publicKey, decimals);

    status("تم إنشاء الرمز: " + mint.toBase58() + "\nجارٍ إنشاء حساب الاستلام...");
    const account = await getOrCreateAssociatedTokenAccount(
      connection, provider, mint, publicKey
    );

    status("جارٍ طلب توقيع سكّ الكمية الأولية...");
    const signature = await mintTo(
      connection, provider, mint, account.address, publicKey, BigInt(raw)
    );

    status(
      "اكتملت العملية.\n" +
      "اسم العملة: " + $("tokenName").value + "\n" +
      "الرمز: " + $("tokenSymbol").value + "\n" +
      "عنوان الرمز: " + mint.toBase58() + "\n" +
      "حساب الاستلام: " + account.address.toBase58() + "\n" +
      "معاملة السكّ: " + signature + "\n\n" +
      "الرابط: https://explorer.solana.com/address/" +
      mint.toBase58() + "?cluster=mainnet-beta\n\n" +
      "تنبيه: الاسم والرمز هنا للعرض فقط، ولا تُحفظ بياناتهما الوصفية على السلسلة."
    );
  } catch (e) {
    console.error(e);
    status("لم تكتمل العملية: " + (e.message || String(e)));
  } finally {
    busy = false;
    $("connect").disabled = false;
    $("create").disabled = !publicKey;
  }
};

provider = findWallet();
if (provider?.isConnected && provider.publicKey) {
  publicKey = provider.publicKey;
  $("wallet").textContent = "متصل: " + publicKey.toBase58();
  $("create").disabled = false;
}
</script>
</body>
</html>
